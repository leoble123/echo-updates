name: Build Echo Server

on:
  push:
    branches: [server]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon, like the iMac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build the settings UI
        run: npm run build-ui
      - name: Build the server
        working-directory: packages/server
        run: npm run build
      - name: Package (Apple Silicon, unsigned - the Mac signs it on install)
        working-directory: packages/server
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder build --mac dir --arm64 --publish never --config ./scripts/electron-builder-config.js -c.mac.identity=null
      - name: Seal and zip
        id: pack
        run: |
          APP=$(find packages/server/releases -maxdepth 3 -name "*.app" | head -1)
          echo "Built: $APP"
          codesign --force --deep -s - "$APP"
          VERSION=$(node -p "require('./packages/server/package.json').version")
          OUT="EchoServer-$VERSION-$GITHUB_RUN_NUMBER.zip"
          ditto -c -k --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          du -h "$OUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=server-$VERSION-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build Echo for Mac
        id: app
        run: |
          cd mac-app
          swift build -c release --arch arm64
          BIN=$(swift build -c release --arch arm64 --show-bin-path)/Echo
          APPDIR="$RUNNER_TEMP/Echo.app"
          mkdir -p "$APPDIR/Contents/MacOS" "$APPDIR/Contents/Resources"
          cp "$BIN" "$APPDIR/Contents/MacOS/Echo"
          # The installer, so Echo can update itself the same way it was installed.
          curl -fsSL -o "$APPDIR/Contents/Resources/echo-server.sh" \
            "https://raw.githubusercontent.com/leoble123/echo-updates/main/mac/echo-server.sh"
          grep -q "install_echo_app" "$APPDIR/Contents/Resources/echo-server.sh" || { echo "::error::published installer doesn't know Echo.app yet"; exit 1; }
          # Icon from the BlueBubbles-derived artwork already in the repo.
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s ../icons/regular/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d ../icons/regular/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APPDIR/Contents/Resources/AppIcon.icns"
          cat > "$APPDIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.echo.app</string>
            <key>CFBundleName</key><string>Echo</string>
            <key>CFBundleDisplayName</key><string>Echo</string>
            <key>CFBundleExecutable</key><string>Echo</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.$GITHUB_RUN_NUMBER</string>
            <key>CFBundleVersion</key><string>$GITHUB_RUN_NUMBER</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$APPDIR/Contents/Info.plist"
          plutil -lint "$APPDIR/Contents/Info.plist"
          codesign --force --deep -s - "$APPDIR"
          # It must launch and stay up (no engine is running here, so it shows "not answering").
          "$APPDIR/Contents/MacOS/Echo" > app.log 2>&1 &
          APID=$!
          sleep 12
          kill -0 $APID || { echo "::error::Echo.app exited at launch"; cat app.log; exit 1; }
          screencapture -x app.png || true
          kill $APID
          OUT="Echo-$GITHUB_RUN_NUMBER.zip"
          (cd "$RUNNER_TEMP" && ditto -c -k --keepParent Echo.app "$GITHUB_WORKSPACE/$OUT")
          shasum -a 256 "$GITHUB_WORKSPACE/$OUT" | sed "s#$GITHUB_WORKSPACE/##" > "$GITHUB_WORKSPACE/$OUT.sha256"
          du -h "$GITHUB_WORKSPACE/$OUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
      - name: Smoke test (it must start and stay up)
        run: |
          APP=$(find packages/server/releases -maxdepth 3 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          touch start.marker
          ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 40
          tail -n 60 smoke.log
          screencapture -x smoke.png || true
          echo "--- files the app wrote"
          find "$HOME/Library" /tmp -newer start.marker -type f 2>/dev/null | grep -v -E "Caches/com.apple|/Metadata/|\.DS_Store" | head -60
          if ! kill -0 $PID 2>/dev/null; then echo "::error::Echo Server exited during startup"; exit 1; fi
          echo "--- logs written during the run"
          find "$HOME/Library/Logs" -name "*.log" -newer start.marker -print -exec tail -n 25 {} \; 2>/dev/null | cut -c1-220
          echo "--- Echo settings in the shared config database"
          CFG="$HOME/Library/Application Support/bluebubbles-server/config.db"
          test -f "$CFG" || { echo "::error::config.db isn't in BlueBubbles' data folder"; exit 1; }
          sqlite3 "$CFG" "select name, value from config where name like 'echo%' or name in ('headless','check_for_updates','disable_gpu','open_findmy_on_startup','auto_start_method');"
          test "$(sqlite3 "$CFG" "select value from config where name='echo_lean_applied';")" = "1" || { echo "::error::Echo's lean defaults weren't applied"; exit 1; }
          test "$(sqlite3 "$CFG" "select value from config where name='check_for_updates';")" = "0" || { echo "::error::BlueBubbles' updater is still on"; exit 1; }
          # It must get all the way through start-up, not just stay alive.
          LOG="$HOME/Library/Logs/bluebubbles-server/main.log"
          for i in $(seq 1 30); do grep -q "Echo Guard is watching" "$LOG" 2>/dev/null && break; sleep 3; done
          grep -q "Echo Guard is watching" "$LOG" || { echo "::error::Start-up didn't finish. Last log lines:"; tail -n 15 "$LOG"; exit 1; }
          grep -n "Starting HTTP service\|Echo Guard is watching" "$LOG"
          kill $PID; sleep 3; kill -9 $PID 2>/dev/null || true
      - name: Reminders & Notes scripts compile (and run, where CI allows)
        run: |
          mkdir -p jxa
          # From outside the repo: npm rejects the root package.json's devEngines.
          (cd "$RUNNER_TEMP" && npx --yes -p typescript@5.4.5 tsc --module commonjs --target es2019 \
            --outDir "$GITHUB_WORKSPACE/jxa" "$GITHUB_WORKSPACE/packages/server/src/server/services/echoMacApps/scripts.ts")
          node -e '
            const fs = require("fs"); const s = require("./jxa/scripts.js");
            for (const [k, v] of Object.entries(s)) fs.writeFileSync("jxa/" + k + ".js", v);
          '
          for f in jxa/[A-Z]*.js; do
            osacompile -l JavaScript -o "${f%.js}.scpt" "$f" || { echo "::error::$f doesn't compile"; exit 1; }
            echo "compiles: $f"
          done
          # Live, but only informational: a CI Mac may not let scripts control Notes/Reminders.
          run() { perl -e 'alarm 40; exec @ARGV' osascript -l JavaScript "jxa/$1.js" "$2" 2>&1 | cut -c1-300; }
          echo "--- NOTE_CREATE"; OUT=$(run NOTE_CREATE '{"html":"<div><h1>Echo CI &amp; test</h1></div><div>line &lt;2&gt;</div>"}'); echo "$OUT"
          ID=$(echo "$OUT" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          if [ -n "$ID" ]; then
            echo "--- NOTE_GET"; run NOTE_GET "{\"id\":\"$ID\"}"
            echo "--- NOTE_UPDATE"; run NOTE_UPDATE "{\"id\":\"$ID\",\"html\":\"<div><h1>Edited</h1></div>\"}"
            echo "--- NOTES_LIST"; run NOTES_LIST '{"limit":5}'
          fi
          echo "--- REMINDERS_LIST"; run REMINDERS_LIST '{}'
          true
      - name: Claude SDK runs in Echo Server's own runtime
        run: |
          APP=$(find packages/server/releases -maxdepth 3 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          SDK="$PWD/$APP/Contents/Resources/app.asar/node_modules/@anthropic-ai/sdk"
          # Electron's own Node, reading the SDK out of the packaged app. Nothing listens on
          # port 9, so a working SDK fails with a connection error - anything else is a bug.
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e '
            const A = require(process.argv[1]);
            console.log("node", process.version);
            const c = new A.default({ apiKey: "sk-ant-test", baseURL: "http://127.0.0.1:9", maxRetries: 0 });
            c.beta.messages.create({ model: "claude-opus-5-5", max_tokens: 1, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default", messages: [{ role: "user", content: "x" }] })
              .then(() => process.exit(2))
              .catch(e => { console.log("SDK error as expected:", e.constructor.name); process.exit(e instanceof A.default.APIConnectionError ? 0 : 3); });
          ' "$SDK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.png
            smoke.log
            app.png
            app.log
      - uses: actions/upload-artifact@v4
        with:
          name: echo-server
          path: ${{ steps.pack.outputs.zip }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pack.outputs.tag }}" "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.zip }}.sha256" \
            "${{ steps.app.outputs.zip }}" "${{ steps.app.outputs.zip }}.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "Echo Server ${{ steps.pack.outputs.tag }}" --notes "Built from $GITHUB_SHA"
      - name: Retire known-bad builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1: stock BlueBubbles test build. 2: crashed at start (import cycle).
          for t in server-1.9.9-1 server-1.9.9-2; do gh release delete "$t" --cleanup-tag -y 2>/dev/null || true; done
